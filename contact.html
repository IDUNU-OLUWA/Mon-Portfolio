<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("porfolio/paysage5.jpg") no-repeat center fixed;
      background-size: cover;
      color: #fff;
    }

    .overlay {
      background: rgba(109, 58, 58, 0.6);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-box {
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .hidden {
      display: none;
    }

    .divider {
      margin: 20px 0;
      border-top: 1px solid #ccc;
    }

    .btn-whatsapp {
      display: block;
      text-align: center;
      width: 100%;
      padding: 12px;
      background-color: #25D366;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.3s;
    }

    .btn-whatsapp:hover {
      background-color: #1eb954;
    }
  </style>
</head>
<body>

    <div class="overlay">
        <div class="form-box">
            <h2>Formulaire de contact</h2>
      
            <form action="https://formspree.io/f/xnpqqgld" method="post">

                <input type="hidden" name="_next" value="https://idunu-oluwa.github.io/portfolio/index.html">

                <label>Type de contact</label>
                
                <select id="type" name="type" onchange="toggleFields()" required>
                    <option value="">-- Choisir --</option>
                    <option value="particulier">Particulier</option>
                    <option value="entreprise">Entreprise</option>
                </select>

                <div id="particulier-fields" class="hidden">
                    <label>Nom et prénom</label>
                    <input type="text" name="nom_particulier">
          
                    <label>Email</label>
                    <input type="email" name="email_particulier">
                </div>

                <div id="entreprise-fields" class="hidden">
                    <label>Nom de l'entreprise</label>
                    <input type="text" name="nom_entreprise">
          
                    <label>Nom du contact</label>
                    <input type="text" name="contact_entreprise">
          
                    <label>Email professionnel</label>
                    <input type="email" name="email_entreprise">
          
                    <label>SIRET / N° d'entreprise</label>
                    <input type="text" name="siret">
                </div>

                <label>Parlez-moi de votre projet:</label>
                <textarea name="message_projet" rows="4" required></textarea>
                
                <label> Un Message ou une suggestion ?</label>
                <textarea name="suggestion" rows="5"></textarea>

                <button type="submit">Envoyer par Email</button>
            </form>

            <div class="divider"></div>
            <a href="https://wa.me/22963732326?text=Bonjour,%20je%20souhaite%20vous%20contacter%20suite%20%C3%A0%20votre%20portfolio !" 
               target="_blank" 
               class="btn-whatsapp">
               Discuter sur WhatsApp
            </a> 
        </div>
    </div>

  <script>
    function toggleFields() {
      const type = document.getElementById('type').value;
      const partBox = document.getElementById('particulier-fields');
      const entBox = document.getElementById('entreprise-fields');

      partBox.classList.add('hidden');
      entBox.classList.add('hidden');

      partBox.querySelectorAll('input').forEach(input => input.required = false);
      entBox.querySelectorAll('input').forEach(input => input.required = false);
      
      if (type === 'particulier') {
        partBox.classList.remove('hidden');
        partBox.querySelectorAll('input').forEach(input => input.required = true);
      } else if (type === 'entreprise') {
        entBox.classList.remove('hidden');
        entBox.querySelectorAll('input').forEach(input => input.required = true);
      }
    }
  </script>

</body>
</html>
